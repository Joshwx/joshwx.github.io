<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weather Map Wall</title>
<link rel="stylesheet" href="style.css">
<style>
.slidecontainer{
  width:100%
}


.slider{
  -webkit-appearance: none;
  width:100%;
  height:10px;
  background:#d3d3d3;
  outline: none;
  opacity: .7;
  -webkit-transition: .2s;
  transition: opacity .2s;
}

.slider:hover{
  opacity: 1;
}

.slider::-webkit-slider-thumb{
  -webkit-appearance: none;
  appearance: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #66ccff;
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(0,0,0,.3);
  transition: transform .15s;
}
.slider::-webkit-slider-thumb:hover{
  transform: scale(1.1);
}

.slider::-moz-range-thumb{
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: none;
  background: #66ccff;
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(0,0,0,.3);
}

.slider::-moz-range-track{
  width: 100%;
  height: 10px;
  border-radius: 5px;
  background: #d3d3d3;
}
</style>
</head>
<body>

<h1 id="pageTitle"></h1>
<div id="meta"></div>

<img id="mapImage" src="" alt="Weather map frame">

<!-- TODO: first/prev/play/next/last buttons + range slider -->
<div id="controls">
  <div class="slidecontainer">
    <input type="range" min="1" max="100" value="50" class="slider" id="myRange">
  </div>
</div>

<script>
let frames = Array.from({ length: 53 }, (_, i) =>
  `assets/maps/upper_level_300mb/${String(i).padStart(2, "0")}.png`
);
const slider = document.getElementById('myRange');
const img = document.getElementById("mapImage");

slider.max = frames.length - 1;

function showFrame(i) {
  img.src = frames[i];
  slider.value = i;
}
showFrame(0);

slider.addEventListener("input", () => {
  showFrame(Number(slider.value));
});

</script>
</body>
</html>
