<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weather Map Wall</title>
<link rel="stylesheet" href="style.css">
<style>

.slidecontainer{
  width:100%
}


.slider{
  -webkit-appearance: none;
  width:100%;
  height:10px;
  background:#d3d3d3;
  outline: none;
  opacity: .7;
  -webkit-transition: .2s;
  transition: opacity .2s;
}

.slider:hover{
  opacity: 1;
}

.slider::-webkit-slider-thumb{
  -webkit-appearance: none;
  appearance: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #66ccff;
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(0,0,0,.3);
  transition: transform .15s;
}
.slider::-webkit-slider-thumb:hover{
  transform: scale(1.1);
}

.slider::-moz-range-thumb{
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: none;
  background: #66ccff;
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(0,0,0,.3);
}

.slider::-moz-range-track{
  width: 100%;
  height: 10px;
  border-radius: 5px;
  background: #d3d3d3;
}
</style>
</head>
<body>
<nav id="navbar">
  <div class="dropdown">
    <button class="button">Upper Air</button>
    <div class="content">
      <a href="#"data-map="300mb">300mb Analysis</a>
      <a href="#"data-map="500mb">500mb Analysis</a>
      <a href="#"data-map="700mb">700mb Analysis</a>
      <a href="#"data-map="850mb">850mb Analysis</a>
    </div>
  </div>
  <div class="dropdown">
    <button class="button">Current Obs</button>
    <div class="content">
      <a href="#"data-map="mrms">MRMS Viewer</a>
      <a href="#"data-map="soundings">Soundings</a>
    </div>
  </div>
</nav>

<h1 id="pageTitle"></h1>
<div id="meta"></div>

<img id="mapImage" src="" alt="Weather map frame">

<!-- TODO: first/prev/play/next/last buttons + range slider -->
<div id="controls">
  <div class="slidecontainer">
    <input type="range" min="1" max="100" value="50" class="slider" id="myRange">
  </div>
</div>

<script>
const slider = document.getElementById('myRange');
const img = document.getElementById("mapImage");
let frames = [];

function showFrame(i) {
  const folder=mapFolders[currentMap];
  img.src=`/assets/maps/${folder}/${frames[i].file}`;
  slider.value=i;
}

const mapFolders={
  "300mb":"upper_level_300mb",
  "500mb":"upper_level_500mb",
  "700mb":"upper_level_700mb",
  "850mb":"upper_level_850mb",
};
let currentMap="300mb"

async function loadMap(mapName) {
  currentMap = mapName;
  const folder = mapFolders[mapName];
  const res = await fetch(`/assets/maps/${folder}/document.json`);
  const data = await res.json();
  frames = data.frames;
  slider.max = frames.length - 1;
  showFrame(0);
}


slider.addEventListener("input", () => {
  showFrame(Number(slider.value));
});


document.querySelectorAll('[data-map]').forEach(link=>{
  link.addEventListener('click', (e)=>{
    e.preventDefault();
    if (mapFolders[link.dataset.map]){
      loadMap(link.dataset.map);
    }
  })
})


loadMap(currentMap);


</script>
</body>
</html>
