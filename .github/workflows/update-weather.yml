name: Update Weather Maps

on:
  schedule:
    - cron: "30 3,9,15,21 * * *"
  workflow_dispatch:

concurrency:
  group: update-weather-maps
  cancel-in-progress: false

jobs:
  run-300mb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: Map_wall
          miniforge-version: latest
          use-mamba: true

      - name: Run 300mb script
        shell: bash -l {0}
        run: python "Maps/Upper_Air/Looped_Upper_Air/looped_300mb.py"

      - name: Upload 300mb output
        uses: actions/upload-artifact@v4
        with:
          name: maps-300mb
          path: assets/maps/upper_level_300mb/

  run-500mb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: Map_wall
          miniforge-version: latest
          use-mamba: true

      - name: Run 500mb script
        shell: bash -l {0}
        run: python "Maps/Upper_Air/Looped_Upper_Air/looped_500mb.py"

      - name: Upload 500mb output
        uses: actions/upload-artifact@v4
        with:
          name: maps-500mb
          path: assets/maps/upper_level_500mb/

  run-500mb-vort:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: Map_wall
          miniforge-version: latest
          use-mamba: true

      - name: Run 500mb vort script
        shell: bash -l {0}
        run: python "Maps/Upper_Air/Looped_Upper_Air/looped_500mb_vort.py"

      - name: Upload 500mb vort output
        uses: actions/upload-artifact@v4
        with:
          name: maps-500mb-vort
          path: assets/maps/upper_level_500mb_vort/

  run-500mb-abs-vort-advection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: Map_wall
          miniforge-version: latest
          use-mamba: true

      - name: Run 500mb abs vort advection script
        shell: bash -l {0}
        run: python "Maps/Upper_Air/Looped_Upper_Air/looped_abs_vort_advection.py"

      - name: Upload 500mb abs vort advection output
        uses: actions/upload-artifact@v4
        with:
          name: maps-500mb-abs-vort-advection
          path: assets/maps/abs_vort_advection/

  run-700mb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: Map_wall
          miniforge-version: latest
          use-mamba: true

      - name: Run 700mb script
        shell: bash -l {0}
        run: python "Maps/Upper_Air/Looped_Upper_Air/looped_700mb.py"

      - name: Upload 700mb output
        uses: actions/upload-artifact@v4
        with:
          name: maps-700mb
          path: assets/maps/upper_level_700mb/

  run-850mb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: Map_wall
          miniforge-version: latest
          use-mamba: true

      - name: Run 850mb script
        shell: bash -l {0}
        run: python "Maps/Upper_Air/Looped_Upper_Air/looped_850mb.py"

      - name: Upload 850mb output
        uses: actions/upload-artifact@v4
        with:
          name: maps-850mb
          path: assets/maps/upper_level_850mb/

  run-850mb-advection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: Map_wall
          miniforge-version: latest
          use-mamba: true

      - name: Run 850mb advection script
        shell: bash -l {0}
        run: python "Maps/Upper_Air/Looped_Upper_Air/looped_850_advection.py"

      - name: Upload 850mb advection output
        uses: actions/upload-artifact@v4
        with:
          name: maps-850-advection
          path: assets/maps/850_advection/

  run-q-vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: Map_wall
          miniforge-version: latest
          use-mamba: true

      - name: Run q-vectors script
        shell: bash -l {0}
        run: python "Maps/Upper_Air/Looped_Upper_Air/looped_q_vectors.py"

      - name: Upload q-vectors output
        uses: actions/upload-artifact@v4
        with:
          name: maps-q-vectors
          path: assets/maps/q_vectors/

  commit:
    needs: [ run-300mb, run-500mb, run-500mb-vort, run-500mb-abs-vort-advection, run-700mb, run-850mb, run-850mb-advection, run-q-vectors ]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Pull latest changes
        run: git pull --rebase -X ours origin main

      - name: Download 300mb artifact
        uses: actions/download-artifact@v4
        with:
          name: maps-300mb
          path: assets/maps/upper_level_300mb/

      - name: Download 500mb artifact
        uses: actions/download-artifact@v4
        with:
          name: maps-500mb
          path: assets/maps/upper_level_500mb/

      - name: Download 500mb vort artifact
        uses: actions/download-artifact@v4
        with:
          name: maps-500mb-vort
          path: assets/maps/upper_level_500mb_vort/

      - name: Download 500mb abs vort advection artifact
        uses: actions/download-artifact@v4
        with:
          name: maps-500mb-abs-vort-advection
          path: assets/maps/abs_vort_advection/

      - name: Download 700mb artifact
        uses: actions/download-artifact@v4
        with:
          name: maps-700mb
          path: assets/maps/upper_level_700mb/

      - name: Download 850mb artifact
        uses: actions/download-artifact@v4
        with:
          name: maps-850mb
          path: assets/maps/upper_level_850mb/

      - name: Download 850mb advection artifact
        uses: actions/download-artifact@v4
        with:
          name: maps-850-advection
          path: assets/maps/850_advection/

      - name: Download q-vectors artifact
        if: needs.run-q-vectors.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: maps-q-vectors
          path: assets/maps/q_vectors/

      - name: Commit and push updated maps
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update weather maps"
          file_pattern: "assets/maps/**"