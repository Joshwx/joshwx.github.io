name: Update Weather Maps

on:
  schedule:
    - cron: "30 */1 * * *"
  workflow_dispatch:

concurrency:
  group: update-weather-maps
  cancel-in-progress: false

jobs:
  update-maps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: Map_wall
          miniforge-version: latest
          use-mamba: true

      - name: Run weather map script
        shell: bash -l {0}
        run: |
          python "Maps/Upper_Air/Looped_Upper_Air/looped_300mb.py"
      - name: Run METAR/MRMS Script
        shell: bash -l {0}
        env:
          SYNOPTIC_TOKEN: ${{ secrets.SYNOPTIC_TOKEN }}
        continue-on-error: true
        run: |
          python "Maps/synoptic_stations.py"

      - name: Pull latest changes
        run: |
          git stash --include-untracked
          git pull --rebase origin main
          git stash pop

      - name: Commit and push updated maps
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update weather maps"
          file_pattern: "assets/maps/**"