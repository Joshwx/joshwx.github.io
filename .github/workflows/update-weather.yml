name: Update Weather Maps

on:
  schedule:
    - cron: "30 3,9,15,21 * * *"
  workflow_dispatch:

concurrency:
  group: update-weather-maps
  cancel-in-progress: false

jobs:
  run-300mb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: Map_wall
          miniforge-version: latest
          use-mamba: true

      - name: Run 300mb script
        shell: bash -l {0}
        run: python "Maps/Upper_Air/Looped_Upper_Air/looped_300mb.py"

      - name: Upload 300mb output
        uses: actions/upload-artifact@v4
        with:
          name: maps-300mb
          path: assets/maps/upper_level_300mb/

  run-500mb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: Map_wall
          miniforge-version: latest
          use-mamba: true

      - name: Run 500mb script
        shell: bash -l {0}
        run: python "Maps/Upper_Air/Looped_Upper_Air/looped_500mb.py"

      - name: Upload 500mb output
        uses: actions/upload-artifact@v4
        with:
          name: maps-500mb
          path: assets/maps/upper_level_500mb/

  run-850mb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: Map_wall
          miniforge-version: latest
          use-mamba: true

      - name: Run 850mb script
        shell: bash -l {0}
        run: python "Maps/Upper_Air/Looped_Upper_Air/looped_850mb.py"

      - name: Upload 850mb output
        uses: actions/upload-artifact@v4
        with:
          name: maps-850mb
          path: assets/maps/upper_level_850mb/

  run-metar-mrms:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: Map_wall
          miniforge-version: latest
          use-mamba: true

      - name: Run METAR/MRMS script
        shell: bash -l {0}
        env:
          SYNOPTIC_TOKEN: ${{ secrets.SYNOPTIC_TOKEN }}
        run: python "Maps/synoptic_stations.py"

      - name: Upload METAR/MRMS output
        uses: actions/upload-artifact@v4
        with:
          name: maps-metar-mrms
          path: assets/maps/metar_mrms/

  commit:
    needs: [ run-300mb, run-500mb, run-850mb, run-metar-mrms ]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Download 300mb artifact
        uses: actions/download-artifact@v4
        with:
          name: maps-300mb
          path: assets/maps/upper_level_300mb/

      - name: Download 500mb artifact
        uses: actions/download-artifact@v4
        with:
          name: maps-500mb
          path: assets/maps/upper_level_500mb/

      - name: Download 850mb artifact
        uses: actions/download-artifact@v4
        with:
          name: maps-850mb
          path: assets/maps/upper_level_850mb/

      - name: Download METAR/MRMS artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: maps-metar-mrms
          path: assets/maps/metar_mrms/

      - name: Pull latest changes
        run: git pull --rebase -X ours origin main

      - name: Commit and push updated maps
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update weather maps"
          file_pattern: "assets/maps/**"