name: Update Soundings

on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: update-soundings
  cancel-in-progress: true

jobs:
  run-sounding:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: Map_wall
          miniforge-version: latest
          use-mamba: true

      - name: Run SounderPY RAOB script
        shell: bash -l {0}
        run: python "Maps/Soundings/SounderPy_RAOB.py"

      - name: Upload sounding output
        uses: actions/upload-artifact@v4
        with:
          name: soundings
          path: assets/soundings/

  commit:
    needs: run-sounding
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Pull latest changes
        run: git pull --rebase -X ours origin main

      - name: Download sounding artifact
        uses: actions/download-artifact@v4
        with:
          name: soundings
          path: assets/soundings/

      - name: Commit and push updated soundings
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update soundings"
          file_pattern: "assets/soundings/**"